<body class="flex flex-col text-on-background overflow-x-hidden">

<header class="flex items-center w-full px-margin-mobile h-16 bg-transparent">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary text-2xl" data-icon="home_pin">home_pin</span>
<h1 class="text-headline-md font-headline-md font-extrabold text-primary tracking-tight">Roomting</h1>
</div>
</header>
<!-- Main Content -->
<main class="flex-grow flex flex-col px-margin-mobile pt-12 pb-24 max-w-[430px] mx-auto w-full">
<!-- Header Text -->
<div class="mb-12">
<p class="font-label-md text-label-md text-primary font-bold mb-3 uppercase tracking-wider">Login</p>
<h2 class="font-display-lg text-display-lg leading-tight text-on-background mb-4">

            </h2>
<p class="font-body-md text-body-md text-ink-soft">
                계정 유형에 맞는 로그인 화면으로 안내할게요
            </p>
</div>
<!-- Selection Stack -->
<div class="space-y-6">
<!-- General Member -->
<button class="type-card w-full text-left flex items-center justify-between p-8 bg-paper rounded-[32px] group shadow-sm hover:shadow-md border border-line/30">
<div class="flex items-center gap-5">
<div class="w-14 h-14 rounded-2xl bg-surface-container-low flex items-center justify-center text-primary group-hover:bg-primary group-hover:text-paper transition-colors duration-300">

</div>
<div>
<h3 class="font-headline-sm text-headline-sm text-on-surface">일반회원</h3>
<p class="font-body-sm text-body-sm text-ink-soft">방을 구하고 있어요</p>
</div>
</div>
<span class="material-symbols-outlined text-inactive-gray group-hover:text-primary group-hover:translate-x-1 transition-all" data-icon="chevron_right">chevron_right</span>
</button>

<button class="type-card w-full text-left flex items-center justify-between p-8 bg-paper rounded-[32px] group shadow-sm hover:shadow-md border border-line/30">
